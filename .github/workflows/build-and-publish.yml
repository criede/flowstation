name: Build and publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full commit SHA for a daily build (empty means current branch)
        type: string
      tag:
        description: Existing release tag vX.Y.Z (empty means daily prerelease)
        type: string
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
    secrets:
      APT_SIGNING_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve source and package version
        id: version
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: python3 .github/scripts/release-version.py
      - name: Require signing key before building
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: test -n "$APT_SIGNING_KEY" || { echo '::error::Set repository secret APT_SIGNING_KEY first'; exit 1; }
      - name: Create draft release for the build jobs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          SOURCE_SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --target "$SOURCE_SHA" --title "FlowStation $RELEASE_TAG" --generate-notes
          fi
  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    permissions:
      contents: write
    with:
      source_sha: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}
      release_tag: ${{ needs.prepare.outputs.tag }}
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download built packages from the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/packages"
          # GitHub stores "~" in asset names as "."
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/packages" --pattern "*_${VERSION}.*"
      - name: Install repository tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends gnupg dpkg-dev apt-utils
      - name: Import signing key into isolated keyring
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/flowstation-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s' "$APT_SIGNING_KEY" | gpg --batch --import
          fingerprint=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" {print $10; exit}')
          test -n "$fingerprint"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "GPG_KEY_FPR=$fingerprint" >> "$GITHUB_ENV"
      - name: Prepare persistent APT repository
        env:
          REPO_DIR: ${{ runner.temp }}/apt-repository
          PACKAGE_DIR: ${{ runner.temp }}/packages
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin gh-pages; then
            git fetch origin gh-pages
            git worktree add "$REPO_DIR" FETCH_HEAD
          else
            status=$?
            test "$status" -eq 2
            git worktree add --detach "$REPO_DIR" HEAD
            git -C "$REPO_DIR" checkout --orphan gh-pages
            git -C "$REPO_DIR" rm -rf .
          fi
          bash .github/scripts/publish-apt.sh
      - name: Publish release and persist APT files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          PACKAGE_DIR: ${{ runner.temp }}/packages
          REPO_DIR: ${{ runner.temp }}/apt-repository
        run: |
          set -euo pipefail
          (cd "$PACKAGE_DIR" && sha256sum ./*.deb ./*.tar.gz ./*.txt > SHA256SUMS)
          gh release upload "$RELEASE_TAG" "$PACKAGE_DIR/SHA256SUMS" --clobber
          flags=()
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease --latest=false); fi
          gh release edit "$RELEASE_TAG" --draft=false "${flags[@]}"
          git -C "$REPO_DIR" config user.name 'github-actions[bot]'
          git -C "$REPO_DIR" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$REPO_DIR" add -A
          git -C "$REPO_DIR" commit -m "Publish $RELEASE_TAG"
          git -C "$REPO_DIR" push origin HEAD:refs/heads/gh-pages
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/apt-repository
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
      - name: Prune old daily releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/retention.py releases
      - name: Remove temporary signing keyring
        if: always()
        run: |
          export GNUPGHOME="$RUNNER_TEMP/flowstation-gnupg"
          gpgconf --kill gpg-agent || true
          rm -rf -- "$GNUPGHOME"
