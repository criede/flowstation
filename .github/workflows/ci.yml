name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  automation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check shell scripts
        run: shellcheck .github/scripts/*.sh
      - name: Test release versioning and retention
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Test signed APT repository and tamper rejection
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gnupg dpkg-dev apt-utils
          bash .github/scripts/test-apt.sh
      - name: Check workflow syntax
        env:
          ACTIONLINT_VERSION: '1.7.7'
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o /tmp/actionlint.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint
  rust-and-debian:
    uses: ./.github/workflows/build.yml
    with:
      source_sha: ${{ github.sha }}
      version: 0.0.0-0+ci${{ github.run_number }}
