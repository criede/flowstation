name: Rust and Debian build

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        suite: [bookworm, trixie]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Build and test Rust workspace, then package
        env:
          VERSION: ${{ inputs.version }}
          SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/packages"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/source:ro" \
            -v "$RUNNER_TEMP/packages:/output" \
            -e "DEB_VERSION=${VERSION}~${SUITE}" \
            -e "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" \
            -e "SOURCE_SHA=$(git rev-parse HEAD)" \
            "debian:${SUITE}-slim" bash /source/.github/scripts/build-deb.sh
      - name: Install in clean Debian container
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/source:ro" \
            -v "$RUNNER_TEMP/packages:/packages:ro" \
            "debian:${SUITE}-slim" bash /source/.github/scripts/test-deb.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.suite }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/packages/*
          if-no-files-found: error
          retention-days: 14
